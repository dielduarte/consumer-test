name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm
      shell: bash
      run: |
        npm install -g npm@latest
        echo "npm version after update: $(npm --version)"

    - name: Publish to npm
      shell: bash
      run: |
        # Remove _authToken from setup-node's .npmrc entirely so npm uses OIDC auto-detection
        sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
        npm stage publish --access public
