name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Update npm
      shell: bash
      run: npm install -g npm@latest

    - name: Debug OIDC env
      shell: bash
      run: |
        echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]] && echo YES || echo NO)"
        echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]] && echo YES || echo NO)"

    - name: Fetch npm OIDC token
      shell: bash
      run: |
        RESPONSE=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
        echo "Curl exit code: $?"
        NPM_ID_TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')
        if [[ -z "$NPM_ID_TOKEN" ]]; then
          echo "ERROR: NPM_ID_TOKEN is empty. Raw response: $RESPONSE"
          exit 1
        fi
        echo "NPM_ID_TOKEN fetched (length: ${#NPM_ID_TOKEN})"
        echo "NPM_ID_TOKEN=$NPM_ID_TOKEN" >> $GITHUB_ENV

    - name: Publish to npm
      shell: bash
      run: |
        NPM_CONFIG_PROVENANCE=true npm publish --access public
