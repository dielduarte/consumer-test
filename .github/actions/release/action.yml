name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Update npm
      shell: bash
      run: |
        npm install -g npm@latest
        echo "npm version after update: $(npm --version)"

    - name: Fetch OIDC token and publish
      shell: bash
      run: |
        NPM_ID_TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
        if [[ -z "$NPM_ID_TOKEN" ]]; then
          echo "ERROR: NPM_ID_TOKEN is empty"
          exit 1
        fi
        echo "NPM_ID_TOKEN fetched (length: ${#NPM_ID_TOKEN})"
        npm config set //registry.npmjs.org/:_id-token "$NPM_ID_TOKEN"
        NPM_ID_TOKEN="$NPM_ID_TOKEN" NPM_CONFIG_PROVENANCE=true npm publish --access public --loglevel verbose
