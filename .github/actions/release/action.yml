name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Update npm
      shell: bash
      run: npm install -g npm@latest

    - name: Publish to npm (staged)
      shell: bash
      run: npm stage publish --access public
