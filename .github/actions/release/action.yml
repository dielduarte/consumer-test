name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Update npm
      shell: bash
      run: npm install -g npm@latest

    - name: Publish to npm (staged)
      shell: bash
      # npm stage publish requires the package to already exist on npm.
      # For the very first release, run: npm publish --access public
      run: npm stage publish --access public
