name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm
      shell: bash
      run: |
        npm install -g npm@latest
        echo "npm version after update: $(npm --version)"

    - name: Publish to npm
      shell: bash
      env:
        NODE_AUTH_TOKEN: ''
      run: npm stage publish --access public
