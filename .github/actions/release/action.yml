name: Consumer Release
description: Build + publish steps specific to this repo

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm
      shell: bash
      run: |
        npm install -g npm@latest
        echo "npm version after update: $(npm --version)"

    - name: Fetch OIDC token
      shell: bash
      run: |
        OIDC_TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
        if [[ -z "$OIDC_TOKEN" ]]; then
          echo "ERROR: OIDC token is empty"
          exit 1
        fi
        echo "OIDC token fetched (length: ${#OIDC_TOKEN})"
        # Override NODE_AUTH_TOKEN that setup-node set to GITHUB_TOKEN
        echo "NODE_AUTH_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

    - name: Publish to npm
      shell: bash
      run: npm stage publish --access public
